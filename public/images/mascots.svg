<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" fill="none" role="img" aria-label="Iyma Sweet mascots">
  <!-- Soft blob backdrop -->
  <ellipse cx="240" cy="230" rx="200" ry="160" fill="#FFE8EF"/>
  <!-- Left character: round donut friend -->
  <g transform="translate(70 90)">
    <circle cx="90" cy="140" r="88" fill="#F48BB0"/>
    <circle cx="90" cy="140" r="48" fill="#FFFAF6"/>
    <circle cx="90" cy="140" r="28" fill="#FFE8EF"/>
    <!-- sprinkles -->
    <rect x="48" y="90" width="14" height="5" rx="2" fill="#FFD36E" transform="rotate(-28 48 90)"/>
    <rect x="118" y="100" width="14" height="5" rx="2" fill="#8CC8F2" transform="rotate(24 118 100)"/>
    <rect x="55" y="160" width="12" height="5" rx="2" fill="#8EDAB5" transform="rotate(18 55 160)"/>
    <rect x="125" y="155" width="12" height="5" rx="2" fill="#BDA6EA" transform="rotate(-12 125 155)"/>
    <!-- face -->
    <circle cx="70" cy="125" r="6" fill="#3B2420"/>
    <circle cx="110" cy="125" r="6" fill="#3B2420"/>
    <path d="M74 148c8 10 24 10 32 0" stroke="#3B2420" stroke-width="4" stroke-linecap="round"/>
    <circle cx="62" cy="138" r="7" fill="#FF9E8F" opacity=".7"/>
    <circle cx="118" cy="138" r="7" fill="#FF9E8F" opacity=".7"/>
    <!-- arms -->
    <path d="M10 150c-18 8-22 28-8 36" stroke="#F48BB0" stroke-width="16" stroke-linecap="round"/>
    <path d="M170 150c18 8 22 28 8 36" stroke="#F48BB0" stroke-width="16" stroke-linecap="round"/>
  </g>
  <!-- Right character: cupcake friend -->
  <g transform="translate(230 70)">
    <ellipse cx="100" cy="210" rx="70" ry="18" fill="#CDB9B3" opacity=".35"/>
    <!-- wrapper -->
    <path d="M45 175h110l-14 90H59L45 175Z" fill="#6C93BE"/>
    <path d="M55 175h18v90H59L55 175Z" fill="#3F628C" opacity=".35"/>
    <path d="M127 175h18l-10 90H117L127 175Z" fill="#3F628C" opacity=".25"/>
    <!-- frosting -->
    <path d="M50 175c0-55 30-95 50-95s50 40 50 95c-18-12-34-12-50-2-16-10-32-10-50 2Z" fill="#FFE8EF"/>
    <path d="M70 120c10-18 30-28 50-22" stroke="#FBB0C9" stroke-width="8" stroke-linecap="round"/>
    <!-- cherry -->
    <circle cx="100" cy="78" r="14" fill="#C9477A"/>
    <path d="M100 68c6-14 18-20 28-18" stroke="#6B463C" stroke-width="3" stroke-linecap="round"/>
    <!-- face -->
    <circle cx="82" cy="145" r="5.5" fill="#3B2420"/>
    <circle cx="118" cy="145" r="5.5" fill="#3B2420"/>
    <path d="M88 162c6 8 18 8 24 0" stroke="#3B2420" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="74" cy="155" r="6" fill="#FF9E8F" opacity=".75"/>
    <circle cx="126" cy="155" r="6" fill="#FF9E8F" opacity=".75"/>
  </g>
  <!-- tiny sparkles -->
  <path d="M60 70c2.2 8.5 7.3 13.6 16 16-8.7 2.2-13.8 7.3-16 16-2.2-8.7-7.3-13.8-16-16 8.7-2.4 13.8-7.5 16-16Z" fill="#FBB0C9"/>
  <path d="M400 95c1.6 6.2 5.3 9.9 11.5 11.5-6.2 1.6-9.9 5.3-11.5 11.5-1.6-6.2-5.3-9.9-11.5-11.5 6.2-1.6 9.9-5.3 11.5-11.5Z" fill="#FFD36E"/>
  <path d="M235 40c1.2 4.6 3.9 7.3 8.5 8.5-4.6 1.2-7.3 3.9-8.5 8.5-1.2-4.6-3.9-7.3-8.5-8.5 4.6-1.2 7.3-3.9 8.5-8.5Z" fill="#F48BB0"/>
</svg>
